[workspace]
resolver = "2"
members = ["crates/pusmogo-core", "crates/pusmogo-mcp", "crates/pusmogo-bench"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# Unwind, not abort: the C ABI catches a core panic and returns an error
# value (`ffi::guard`) instead of taking the whole app down.
panic = "unwind"
